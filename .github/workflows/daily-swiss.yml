name: Swiss Hubs Daily Scraper

on:
  schedule:
    # Runs every night at 02:30 UTC
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scrape Mode'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - genesis

jobs:
  scrape-swiss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Swiss Daily Scraper
        env:
          LOBSTR_API_KEY: ${{ secrets.LOBSTR_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "genesis" ]; then
            npm run scrape:genesis
          else
            npm run scrape:daily
          fi
